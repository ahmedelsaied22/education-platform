version: 'v5.2.0'
services:
  postgres-db:
    container_name: postgres
    image: postgres:15.3-alpine
    restart: always
    environment:
      # POSTGRES_HOST: postgres-db
      # POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "0000"
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"

  education-platform:
    container_name: education-platform
    build: .
    volumes:
      - ./src:/app/src:ro

    ports:
      - "4000:4000"
    environment:
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=0000
      - DB_NAME=postgres

    depends_on:
      - postgres-db
